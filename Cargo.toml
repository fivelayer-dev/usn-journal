[workspace]
members = ["crates/usn-journal", "crates/usn-watch"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fivelayer-dev/usn-journal"

[workspace.dependencies]
# 0.60 ships its own import libraries. 0.61 needs dlltool on the GNU toolchain.
windows-sys = "0.60"

[profile.release]
lto = true
codegen-units = 1
strip = true
