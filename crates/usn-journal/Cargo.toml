[package]
name = "usn-journal"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Read the Windows USN change journal: raw records, per-file changes, and journal health."
readme = "../../README.md"
keywords = ["usn", "ntfs", "journal", "windows", "filesystem"]
categories = ["filesystem", "os::windows-apis"]

[features]
# Adds the only calls in this crate that change anything on a volume.
journal-admin = []

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]
all-features = true
